[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-wilder-v4"
version = "4.0.0"
description = "Institutional-Grade, Signal-Only Crypto Futures Intelligence System (Binance Research -> CoinDCX Manual Execution)"
readme = "docs/source/BLUEPRINT.md"
authors = [{ name = "NEO-WILDER Chief Architect" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
research = [
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
